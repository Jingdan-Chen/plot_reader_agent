[project]
name = "plot-reader"
version = "0.1.0"
description = "Local, auditable plot digitization for AI agents"
requires-python = ">=3.11"
dependencies = [
  "Pillow==11.3.0",
  "numpy==2.3.3",
  "opencv-python-headless==4.11.0.86",
  "scipy==1.16.2",
  "pytesseract==0.3.13",
  "mcp==1.14.1",
  "matplotlib==3.10.6",
  "starlette==1.6.0",
  "uvicorn==0.53.0",
  "python-multipart==0.0.32",
  "requests>=2.32,<3",
  "jsonschema>=4.25,<5",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx>=0.28,<1"]

[project.scripts]
plot-reader = "plot_reader.dispatch:main"
plot-reader-mcp = "plot_reader.dispatch:mcp_main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
